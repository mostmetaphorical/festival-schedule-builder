# Runs on every pull request and push to main. A festival shared through the
# app, or added by hand, must pass the same validation the share Worker uses
# before it can be merged - and the Worker's own tests must stay green.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  worker-and-festivals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Share Worker tests
        working-directory: worker
        run: node --test "test/*.test.js"
      - name: Validate festival data
        run: node worker/validate-festivals.mjs
