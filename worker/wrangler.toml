# Share endpoint for Meta's Nifty Film Fest Planner.
# Deploy from this directory: npm run deploy (runs the tests first).

name = "festrec-share"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

# Stays on the Workers Free plan. KV on the free plan refuses operations past
# its limits instead of billing, and no payment method is on the account.
[[kv_namespaces]]
binding = "SHARES"
id = "ced137100ce8454e8fa52c7597fa2c46"

# Daily page-load totals only (src/visits.js, schema/visits.sql). Free-plan D1
# refuses writes past its limit rather than billing.
[[d1_databases]]
binding = "VISITS"
database_name = "festrec-visits"
database_id = "71b5c14a-606f-4341-8bc8-f51a01b1744f"

[vars]
ALLOWED_ORIGINS = "https://mostmetaphorical.github.io,http://localhost:8124"
# Well below the free plan's 1 GB and 1,000 writes/day (see src/usage.js).
MAX_UPLOAD_BYTES = "1000000"
MAX_TOTAL_BYTES = "900000000"
MAX_UPLOADS_PER_DAY = "300"

# Secret, set with `wrangler secret put TURNSTILE_SECRET` - never in this file.
